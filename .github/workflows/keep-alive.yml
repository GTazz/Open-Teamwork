# The free Render instance sleeps after 15 minutes without requests.
# This pings the site every 10 minutes so it stays awake (GitHub may delay
# scheduled runs a few minutes; the site can still sleep now and then).
# GitHub pauses scheduled workflows after 60 days without commits: re-enable it
# in the Actions tab if that happens.
name: Keep site awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API and the database
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://open-teamwork.onrender.com/api/health
          curl -fsS --max-time 60 -o /dev/null https://open-teamwork.onrender.com/api/projects
