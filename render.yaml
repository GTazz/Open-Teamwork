# Blueprint do Render (plano gratuito). Veja DEPLOY.md.
services:
  - type: web
    name: open-teamwork
    runtime: node
    plan: free
    # Same region as the Turso database (AWS us-east-1) to keep queries fast.
    region: virginia
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
