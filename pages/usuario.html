    <div id="apply-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="apply-modal-title">
      <div class="modal-content" tabindex="-1">
        <div class="modal-header">
          <h2 id="apply-modal-title" class="modal-title">Escolha as qualificações</h2>
          <button type="button" class="btn close-button" data-modal-close aria-label="Fechar">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill-rule="evenodd" d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <p id="apply-modal-repo" class="modal-subtitle"></p>
          <div id="qualifications-container" class="qualifications-list"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
          <button id="confirm-apply" type="button" class="btn btn-primary">Confirmar</button>
        </div>
      </div>
    </div>

          </button>
        </div>
        <div class="modal-body" id="details-content"></div>
        <div class="modal-actions">
          <button id="details-apply" type="button" class="btn btn-primary apply-button">Candidatar-se</button>
        </div>
      </div>
