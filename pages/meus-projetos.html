<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meus Projetos · Open Teamwork</title>
    <meta name="description" content="Crie projetos e gerencie as candidaturas recebidas." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#010409" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Open Teamwork" />
    <link rel="icon" type="image/png" href="../assets/OTW Logo.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../index.html">
          <img src="../assets/OTW Logo.png" alt="" class="brand-logo" width="32" height="32" />
          <span>Open Teamwork</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
          <a href="../index.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span>Explorar</span>
          </a>
          <a href="./pessoas.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4.1a4 4 0 0 1 0 7.8"/><path d="M22 21a7 7 0 0 0-4.5-6.5"/></svg>
            <span>Colaboradores</span>
          </a>
          <a href="./meus-projetos.html" class="nav-link active" aria-current="page">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Meus Projetos</span>
          </a>
          <a href="./perfil.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span>Perfil</span>
          </a>
          <a href="./sobre.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.01"/></svg>
            <span>Sobre</span>
          </a>
        </nav>
        <div class="header-actions">
          <div class="theme-switcher" data-theme-switcher></div>
        </div>
      </div>
    </header>

    <main id="main" class="container page">
      <div class="page-header">
        <h1>Meus Projetos</h1>
        <button id="btn-new-project" type="button" class="btn btn-primary">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill-rule="evenodd" d="M1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM8 0a8 8 0 100 16A8 8 0 008 0zm.75 4.75a.75.75 0 00-1.5 0v2.5h-2.5a.75.75 0 000 1.5h2.5v2.5a.75.75 0 001.5 0v-2.5h2.5a.75.75 0 000-1.5h-2.5v-2.5z"></path></svg>
          <span>Novo projeto</span>
        </button>
      </div>
      <div id="projects-list" class="project-list">
        <p class="result-counter">Carregando...</p>
      </div>
    </main>

    <div id="create-project-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="create-project-title">
      <div class="modal-content modal-large" tabindex="-1">
        <div class="modal-header">
          <h2 id="create-project-title" class="modal-title">Novo projeto</h2>
          <button type="button" class="btn close-button" data-modal-close aria-label="Fechar">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill-rule="evenodd" d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="project-form" novalidate>
            <div class="form-group">
              <label for="project-name">Nome do projeto</label>
              <input type="text" id="project-name" required maxlength="120" placeholder="Ex: Receitas Colaborativas" data-autofocus />
            </div>

            <div class="form-group">
              <label for="project-description">Descrição</label>
              <textarea id="project-description" required maxlength="5000" rows="4" placeholder="O que o projeto faz e quem você procura"></textarea>
            </div>

            <div class="form-group">
              <label for="project-url">Link do projeto <span class="muted">(opcional)</span></label>
              <input type="url" id="project-url" maxlength="2000" placeholder="https://github.com/usuario/repositorio" />
            </div>

            <div class="form-group">
              <span class="form-label" id="qualifications-label">Qualificações e vagas</span>
              <div id="qualifications-inputs" role="group" aria-labelledby="qualifications-label"></div>
              <div>
                <button type="button" id="btn-add-qual" class="btn btn-secondary btn-small">+ Adicionar qualificação</button>
              </div>
            </div>

            <div class="form-group">
              <label for="project-tags-entry">Tags</label>
              <div class="tag-input" id="project-tags-box">
                <input
                  type="text"
                  id="project-tags-entry"
                  class="tag-input-field"
                  placeholder="JavaScript, React, Node.js"
                  maxlength="40"
                  autocomplete="off"
                  autocapitalize="off"
                  enterkeyhint="done"
                />
              </div>
              <p class="input-hint">Use vírgula ou Enter para criar uma tag e o × para removê-la.</p>
            </div>
          </form>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
          <button id="save-project" type="button" class="btn btn-primary">Criar projeto</button>
        </div>
      </div>
    </div>

    <script src="../js/api-client.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/meus-projetos.js"></script>
  </body>
</html>
